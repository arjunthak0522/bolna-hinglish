name: Add Phrase Library
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".phrase-library-trigger"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 0
      - run: python .github/scripts/add_phrase_library.py
      - run: node --check app-runtime.js
      - run: node --check phrase-library.js
      - run: |
          grep -q 'phrase-library.js' index.html
          grep -q "data-view=\"library\"" app-runtime.js
          grep -q "function renderLibrary" app-runtime.js
          grep -q "grid-template-columns:repeat(4,1fr)" style.css
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html app-runtime.js style.css
          git commit -m "Add India phrase library UI"
          git push origin HEAD:rescue-single-runtime
