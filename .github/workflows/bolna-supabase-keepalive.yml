name: Bolna Supabase Keepalive

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Bolna Supabase keepalive endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://qrtlndbcwnzeebtvnuyr.supabase.co/functions/v1/bolna-keepalive-probe"

          status="$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 60 \
            --output /tmp/bolna-keepalive-response.txt \
            --write-out '%{http_code}' \
            "$URL")"

          if [ "$status" != "204" ]; then
            echo "Bolna keepalive failed with HTTP $status"
            cat /tmp/bolna-keepalive-response.txt || true
            exit 1
          fi

          echo "Bolna keepalive succeeded with HTTP 204"
