name: Float Say Again

on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".float-say-again-trigger"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 0
      - name: Float Say something else on iPhone
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('style.css')
          s=p.read_text()
          old='.hinglish{font-size:36px}.tabs{position:fixed;z-index:5;height:calc(68px + env(safe-area-inset-bottom))}'
          new='.hinglish{font-size:36px}.resultView{padding-bottom:calc(156px + env(safe-area-inset-bottom))}.resultView .speakAgain{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;width:min(calc(100% - 40px),390px);margin:0;border-radius:999px;box-shadow:0 10px 28px rgba(38,32,24,.16)}.tabs{position:fixed;z-index:5;height:calc(68px + env(safe-area-inset-bottom))}'
          if old not in s:
              raise SystemExit('Expected mobile CSS anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add style.css
          git commit -m "Float Say something else above mobile nav"
          git push origin HEAD:rescue-single-runtime
