name: Harden TTS Speech Text
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".harden-tts-trigger"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 0
      - run: python .github/scripts/harden_tts_text.py
      - run: node --check app-runtime.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app-runtime.js
          git commit -m "Force TTS to speak generated Hinglish only"
          git push origin HEAD:rescue-single-runtime
