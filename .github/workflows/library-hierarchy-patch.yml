name: Library hierarchy patch
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".library-hierarchy-trigger"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Library hierarchy change
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-runtime.js')
          s=p.read_text()
          old='<strong>${esc(x.english)}</strong><span>${esc(x.natural)}</span><em>${esc(x.phonetic)}</em>'
          new='<strong>${esc(x.english)}</strong><em>${esc(x.phonetic)}</em><span>${esc(x.natural)}</span>'
          if s.count(old)!=1:
              raise SystemExit(f'expected one Library hierarchy target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          p=Path('style.css')
          s=p.read_text()
          old='.phraseLibraryMain em{font-size:13px;line-height:1.35;color:#c75b38;font-style:normal;font-weight:680}'
          new='.phraseLibraryMain em{font-size:16px;line-height:1.4;color:#c75b38;font-style:normal;font-weight:720}'
          if s.count(old)!=1:
              raise SystemExit(f'expected one phonetic style target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node --check app-runtime.js
          grep -q '<strong>${esc(x.english)}</strong><em>${esc(x.phonetic)}</em><span>${esc(x.natural)}</span>' app-runtime.js
          grep -q '.phraseLibraryMain em{font-size:16px;line-height:1.4' style.css
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-runtime.js style.css
          git commit -m "Improve Library phrase hierarchy"
          git push origin HEAD:rescue-single-runtime
