name: Library remove Hinglish patch
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".library-remove-hinglish-trigger"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Library-only removal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-runtime.js')
          s=p.read_text()
          old='<strong>${esc(x.english)}</strong><em>${esc(x.phonetic)}</em><span>${esc(x.natural)}</span>'
          new='<strong>${esc(x.english)}</strong><em>${esc(x.phonetic)}</em>'
          if s.count(old)!=1:
              raise SystemExit(f'expected one Library card target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node --check app-runtime.js
          grep -q '<strong>${esc(x.english)}</strong><em>${esc(x.phonetic)}</em>' app-runtime.js
          if grep -q '<strong>${esc(x.english)}</strong><em>${esc(x.phonetic)}</em><span>${esc(x.natural)}</span>' app-runtime.js; then exit 1; fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-runtime.js
          git commit -m "Remove Hinglish text from Library list"
          git push origin HEAD:rescue-single-runtime
