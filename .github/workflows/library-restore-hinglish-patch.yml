name: Library restore Hinglish patch
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".library-restore-hinglish-trigger"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Library hierarchy tweak
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-runtime.js')
          s=p.read_text()
          old='<strong>${esc(x.english)}</strong><em>${esc(x.phonetic)}</em>'
          new='<strong>${esc(x.english)}</strong><em>${esc(x.phonetic)}</em><span>${esc(x.natural)}</span>'
          if s.count(old)!=1:
              raise SystemExit(f'expected one Library target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          p=Path('style.css')
          s=p.read_text()
          old='.phraseLibraryMain span{font-size:18px;line-height:1.28;font-weight:790}'
          new='.phraseLibraryMain span{font-size:14px;line-height:1.35;font-weight:650;color:#6e675e}'
          if s.count(old)!=1:
              raise SystemExit(f'expected one Hinglish style target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node --check app-runtime.js
          grep -q '<strong>${esc(x.english)}</strong><em>${esc(x.phonetic)}</em><span>${esc(x.natural)}</span>' app-runtime.js
          grep -q '.phraseLibraryMain span{font-size:14px;line-height:1.35' style.css
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-runtime.js style.css
          git commit -m "Restore smaller Hinglish line in Library"
          git push origin HEAD:rescue-single-runtime
