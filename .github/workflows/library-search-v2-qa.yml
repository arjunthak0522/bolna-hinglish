name: Library Search V2 QA
on:
  push:
    branches: ["library-search-v2"]
    paths: [".library-search-v2-trigger"]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-search-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify committed integration is deterministic
        run: |
          node scripts/apply-library-search-v2.js
          git diff --exit-code
      - name: Syntax checks
        run: |
          node --check app-runtime.js
          node --check library-search.js
          node --check phrase-library-expanded.js
          node --check phrase-library-tier23-friction.js
          node --check phrase-library-survival.js
          node --check tests/library-search-expat-messy.test.js
          node --check tests/library-search-tier23-expat.test.js
          node --check tests/library-search-tier23-friction.test.js
          node --check tests/library-search-survival.test.js
      - name: Verify production voice runtime untouched
        run: |
          git show d4e7016ab6c32bab28eff0de874568b542aec2e1:app-runtime.js > /tmp/prod-runtime.js
          node scripts/verify-library-isolation.js /tmp/prod-runtime.js app-runtime.js
      - name: Library data and search benchmarks
        run: |
          node tests/library-data.test.js
          node tests/library-search-intelligence.test.js
          node tests/library-search-expat-messy.test.js
          node tests/library-search-tier23-expat.test.js
          node tests/library-search-tier23-friction.test.js
          node tests/library-search-survival.test.js
          node tests/voice-context-isolation.test.js
      - name: Diagnose no-match query
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window={};
          for(const f of ['phrase-library.js','phrase-library-expanded.js','phrase-library-tier23-friction.js','phrase-library-survival.js']) vm.runInThisContext(fs.readFileSync(f,'utf8'));
          const search=require('./library-search.js');
          const rows=search.rank(window.BOLNA_PHRASE_LIBRARY,'purple submarine umbrella','All').slice(0,10).map(x=>({score:x.score,english:x.item.english,search:x.item.search||''}));
          console.log(JSON.stringify(rows,null,2));
          NODE
      - name: Browser regression suite
        run: |
          npm install
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
