name: Library Search V2 QA
on:
  push:
    branches: ["library-search-v2"]
    paths: [".library-search-v2-trigger"]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-search-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic Library integration
        run: node scripts/apply-library-search-v2.js
      - name: Verify integration syntax
        run: |
          node --check app-runtime.js
          node --check phrase-library-expanded.js
          git diff --check
      - name: Commit integration only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-runtime.js phrase-library-expanded.js
          if git diff --cached --quiet; then
            echo "Integration already committed"
            exit 0
          fi
          git commit -m "Integrate intelligent English Library search"
          git push origin HEAD:library-search-v2
