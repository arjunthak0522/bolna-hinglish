name: Library Search V2 QA
on:
  push:
    branches: ["library-search-v2"]
    paths: [".library-search-v2-trigger"]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-search-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply isolated Library patch
        run: node scripts/apply-library-search-v2.js
      - name: Syntax checks
        run: |
          node --check app-runtime.js
          node --check library-search.js
          node --check phrase-library-expanded.js
      - name: Verify production voice runtime untouched
        run: |
          git show d4e7016ab6c32bab28eff0de874568b542aec2e1:app-runtime.js > /tmp/prod-runtime.js
          node scripts/verify-library-isolation.js /tmp/prod-runtime.js app-runtime.js
      - name: Library data and search benchmarks
        run: |
          node tests/library-data.test.js
          node tests/library-search-intelligence.test.js
          node tests/voice-context-isolation.test.js
      - name: Browser regression suite
        id: browser
        continue-on-error: true
        run: |
          npm install
          npx playwright install --with-deps chromium webkit
          set +e
          npm run test:e2e 2>&1 | tee library-browser-diagnostic.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save browser diagnostic when failing
        if: steps.browser.outputs.exit_code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library-browser-diagnostic.txt
          git commit -m "Capture Library browser QA failure"
          git push origin HEAD:library-search-v2
          exit 1
      - name: Commit tested integration
        if: steps.browser.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-runtime.js phrase-library-expanded.js
          git diff --cached --check
          git commit -m "Integrate intelligent English Library search"
          git push origin HEAD:library-search-v2
