name: Deploy Bolna to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Purge stored Actions artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          while true; do
            ids=$(gh api --paginate "/repos/${REPO}/actions/artifacts?per_page=100" --jq '.artifacts[].id' | head -100)
            [ -z "$ids" ] && break
            while read -r id; do
              [ -n "$id" ] && gh api --method DELETE "/repos/${REPO}/actions/artifacts/${id}"
            done <<< "$ids"
          done
