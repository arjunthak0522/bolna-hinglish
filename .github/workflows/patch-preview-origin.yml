name: Patch Bolna Preview Origin

on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".preview-origin-trigger"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Bolna preview origin guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/gemini.js')
          s=p.read_text()
          old="""const ALLOWED_ORIGINS = new Set([\n  'https://arjunthak0522.github.io',\n  'http://127.0.0.1:4173',\n  'http://localhost:4173',\n]);"""
          new="""const ALLOWED_ORIGINS = new Set([\n  'https://arjunthak0522.github.io',\n  'http://127.0.0.1:4173',\n  'http://localhost:4173',\n]);\nconst BOLNA_PREVIEW_ORIGIN = /^https:\\/\\/hinglish-companion-[a-z0-9-]+-arjunthak-4571\\.vercel\\.app$/;\nfunction isAllowedOrigin(origin) {\n  return ALLOWED_ORIGINS.has(origin) || BOLNA_PREVIEW_ORIGIN.test(origin);\n}"""
          if old not in s:
              raise SystemExit('Expected origin block not found')
          s=s.replace(old,new,1)
          s=s.replace("if (ALLOWED_ORIGINS.has(origin)) res.setHeader('Access-Control-Allow-Origin', origin);","if (isAllowedOrigin(origin)) res.setHeader('Access-Control-Allow-Origin', origin);",1)
          s=s.replace("if (!ALLOWED_ORIGINS.has(origin)) return send(res, 403, { ok: false, category: 'origin_not_allowed' });","if (!isAllowedOrigin(origin)) return send(res, 403, { ok: false, category: 'origin_not_allowed' });",1)
          p.write_text(s)
          PY
          node --check api/gemini.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add api/gemini.js
          git commit -m "Allow Bolna Vercel preview origin"
          git push origin HEAD:rescue-single-runtime
