name: Persistent Cache Verify

on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".persistent-cache-verify-trigger"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node --check app-runtime.js
      - run: npx playwright test tests/persistent-cache.spec.js --project=chromium-393 --project=webkit-393
