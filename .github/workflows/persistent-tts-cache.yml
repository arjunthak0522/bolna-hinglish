name: Persistent TTS Cache Patch

on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".persistent-tts-cache-trigger"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 0
      - name: Persist successful TTS audio in IndexedDB
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-runtime.js')
          s=p.read_text()
          old1="""const voiceCache=new Map();
const recent=()=>JSON.parse(localStorage.getItem('bolna_recent')||'[]');"""
          new1="""const voiceCache=new Map();
const TTS_DB='bolna_audio_v1',TTS_STORE='clips',TTS_MAX=16;
let ttsDbPromise=null;
function ttsDb(){if(!('indexedDB'in window))return Promise.resolve(null);if(ttsDbPromise)return ttsDbPromise;ttsDbPromise=new Promise(resolve=>{try{const r=indexedDB.open(TTS_DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(TTS_STORE))db.createObjectStore(TTS_STORE,{keyPath:'key'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch{resolve(null)}});return ttsDbPromise}
async function persistentVoiceGet(key){try{const db=await ttsDb();if(!db)return null;return await new Promise(resolve=>{const tx=db.transaction(TTS_STORE,'readwrite'),st=tx.objectStore(TTS_STORE),r=st.get(key);r.onsuccess=()=>{const row=r.result;if(row?.blob instanceof Blob){row.ts=Date.now();st.put(row);resolve(row.blob)}else resolve(null)};r.onerror=()=>resolve(null)})}catch{return null}}
async function trimPersistentVoices(db){try{const rows=await new Promise(resolve=>{const tx=db.transaction(TTS_STORE,'readonly'),r=tx.objectStore(TTS_STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>resolve([])});rows.sort((a,b)=>(b.ts||0)-(a.ts||0));for(const row of rows.slice(TTS_MAX))await new Promise(resolve=>{const tx=db.transaction(TTS_STORE,'readwrite'),r=tx.objectStore(TTS_STORE).delete(row.key);r.onsuccess=r.onerror=()=>resolve()})}catch{}}
async function persistentVoicePut(key,blob){try{const db=await ttsDb();if(!db||!(blob instanceof Blob))return;await new Promise(resolve=>{const tx=db.transaction(TTS_STORE,'readwrite'),r=tx.objectStore(TTS_STORE).put({key,blob,ts:Date.now()});r.onsuccess=r.onerror=()=>resolve()});void trimPersistentVoices(db)}catch{}}
const recent=()=>JSON.parse(localStorage.getItem('bolna_recent')||'[]');"""
          if old1 not in s:
              raise SystemExit('voice cache anchor not found')
          s=s.replace(old1,new1,1)
          old2="""function speech(text,slow=false){const k=`${slow?'slow':'normal'}:${text}`;if(voiceCache.has(k))return voiceCache.get(k);const p=fetchSpeech(text,slow).catch(e=>{voiceCache.delete(k);throw e});voiceCache.set(k,p);return p}"""
          new2="""function speech(text,slow=false){const k=`${slow?'slow':'normal'}:${text}`;if(voiceCache.has(k))return voiceCache.get(k);const p=(async()=>{const cached=await persistentVoiceGet(k);if(cached){note('tts_cache',{tier:'persistent',hit:true});return cached}note('tts_cache',{tier:'persistent',hit:false});const blob=await fetchSpeech(text,slow);void persistentVoicePut(k,blob);return blob})().catch(e=>{voiceCache.delete(k);throw e});voiceCache.set(k,p);return p}"""
          if old2 not in s:
              raise SystemExit('speech function anchor not found')
          p.write_text(s.replace(old2,new2,1))
          PY
          node --check app-runtime.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app-runtime.js
          git commit -m "Persist successful TTS audio cache"
          git push origin HEAD:rescue-single-runtime
