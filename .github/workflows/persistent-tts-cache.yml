name: Persistent TTS Cache Patch

on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".persistent-tts-cache-trigger"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 0
      - name: Apply persistent TTS cache
        run: python .github/scripts/apply_persistent_tts_cache.py
      - name: Verify and commit
        run: |
          node --check app-runtime.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app-runtime.js
          git commit -m "Persist successful TTS audio cache"
          git push origin HEAD:rescue-single-runtime
