name: Bolna Preview Self-Origin Smoke

on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".preview-self-origin-trigger"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_gOE1H89laXqgIoZR5yusx8o8
      VERCEL_PROJECT_ID: prj_dNVPPFV0PIood9pszWxkagxSbOJP
      PREVIEW_URL: https://hinglish-companion-pft8o5ms8-arjunthak-4571.vercel.app
      PREVIEW_ORIGIN: https://hinglish-companion-pft8o5ms8-arjunthak-4571.vercel.app
      EXPECTED_SHA: 4c17986d0dca22ad6ef4c299cc0191c53f9df1d9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify preview self-origin gateway
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          npm install --no-save vercel@latest
          HEALTH=$(npx vercel curl /api/health --deployment "$PREVIEW_URL")
          node -e 'const h=JSON.parse(process.argv[1]); if(!h.ok||h.commit!==process.env.EXPECTED_SHA||h.environment!=="preview") throw new Error("wrong preview");' "$HEALTH"
          RESPONSE=$(npx vercel curl /api/gemini --deployment "$PREVIEW_URL" -- \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Origin: $PREVIEW_ORIGIN" \
            --data '{"operation":"generate","prompt":"Reply with the single word OK."}')
          node -e '
            const r=JSON.parse(process.argv[1]);
            if(!r.ok) throw new Error(`self-origin gateway failed: ${r.category||"unknown"}`);
            if(r.diagnostics?.operation!=="generate") throw new Error("wrong operation");
            if(r.diagnostics?.model!=="gemini-3.5-flash-lite") throw new Error("wrong model");
            if(r.diagnostics?.status!==200) throw new Error(`provider status ${r.diagnostics?.status}`);
            console.log("Preview self-origin gateway verified", r.diagnostics);
          ' "$RESPONSE"
