name: Production Origin Release
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".production-origin-release-trigger"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_gOE1H89laXqgIoZR5yusx8o8
      VERCEL_PROJECT_ID: prj_dNVPPFV0PIood9pszWxkagxSbOJP
      VERCEL_CLI_VERSION: 59.10.0
      RELEASE_SHA: 124696f73b8aaa89d2d479f42ccceb98a7e5dc76
      PROD_ORIGIN: https://hinglish-companion.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact release source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node --check app-runtime.js
          node --check api/gemini.js
          node tests/production-origin.test.js
      - name: Deploy verified source to production once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npm install --no-save "vercel@$VERCEL_CLI_VERSION"
          rm -rf .vercel
          PROD_URL=$(npx vercel deploy --prod --yes --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID")
          echo "PROD_URL=$PROD_URL" >> "$GITHUB_ENV"
      - name: Verify production fingerprint
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          HEALTH=$(npx vercel curl /api/health --deployment "$PROD_URL")
          node -e 'const h=JSON.parse(process.argv[1]); if(!h.ok||h.environment!=="production"||h.commit!==process.env.RELEASE_SHA) throw new Error("production fingerprint mismatch");' "$HEALTH"
      - name: Verify stable hostname and production origin acceptance
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          LIVE=$(npx vercel curl /api/health --deployment "$PROD_ORIGIN")
          node -e 'const h=JSON.parse(process.argv[1]); if(h.commit!==process.env.RELEASE_SHA||h.environment!=="production") throw new Error("stable hostname mismatch");' "$LIVE"
          HTTP=$(curl -sS -o /tmp/origin.json -w "%{http_code}" -X POST "$PROD_ORIGIN/api/gemini" -H "Origin: $PROD_ORIGIN" -H "Content-Type: application/json" --data '{"operation":"not-a-real-operation"}')
          cat /tmp/origin.json
          test "$HTTP" = "400"
          node -e 'const x=require("/tmp/origin.json"); if(x.category!=="invalid_client_request") throw new Error("production origin gate did not pass");'
