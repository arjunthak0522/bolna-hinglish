name: Promote Tested Bolna Release

on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".promote-tested-library-trigger"]

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_gOE1H89laXqgIoZR5yusx8o8
      VERCEL_PROJECT_ID: prj_dNVPPFV0PIood9pszWxkagxSbOJP
      VERCEL_CLI_VERSION: 59.10.0
      RELEASE_SHA: bf01037e94bc0d454f65642efd15e7a581bc3211
      PROD_ALIAS: https://hinglish-companion.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf01037e94bc0d454f65642efd15e7a581bc3211
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact tested source
        shell: bash
        run: |
          ACTUAL=$(git rev-parse HEAD)
          test "$ACTUAL" = "$RELEASE_SHA"
          node --check app-runtime.js
          node --check library-search.js
          node --check api/gemini.js
          node --check api/health.js

      - name: Verify Vercel access
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          STATUS=$(curl --silent --output /tmp/project.json --write-out "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          test "$STATUS" = "200"

      - name: Deploy exact tested SHA to production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --no-save "vercel@$VERCEL_CLI_VERSION"
          rm -rf .vercel
          PROD_URL=$(npx vercel deploy --yes --prod --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID")
          echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"
          echo "PROD_URL=$PROD_URL" >> "$GITHUB_ENV"

      - name: Verify deployed fingerprint
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          HEALTH=$(npx vercel curl /api/health --deployment "$PROD_URL")
          echo "$HEALTH"
          node -e '
            const h=JSON.parse(process.argv[1]);
            if(!h.ok) throw new Error("health not ok");
            if(h.service!=="bolna-gemini-gateway") throw new Error("wrong service");
            if(h.runtime!=="single-v1") throw new Error("wrong runtime");
            if(h.environment!=="production") throw new Error(`wrong environment: ${h.environment}`);
            if(h.commit!==process.env.RELEASE_SHA) throw new Error(`wrong commit: ${h.commit}`);
          ' "$HEALTH"

      - name: Verify production alias points to exact release
        shell: bash
        run: |
          HEALTH=$(curl --fail --silent --show-error "$PROD_ALIAS/api/health")
          echo "$HEALTH"
          node -e '
            const h=JSON.parse(process.argv[1]);
            if(!h.ok) throw new Error("alias health not ok");
            if(h.commit!==process.env.RELEASE_SHA) throw new Error(`production alias wrong commit: ${h.commit}`);
            if(h.environment!=="production") throw new Error(`wrong alias environment: ${h.environment}`);
          ' "$HEALTH"
