name: Bolna Browser QA

on:
  workflow_dispatch:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".qa-trigger"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Static syntax checks
        run: |
          node --check app-runtime.js
          node --check api/gemini.js
          node --check tests/bolna.spec.js
          node --check tests/reliability.spec.js
          node --check tests/microphone.spec.js
          node --check playwright.config.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
