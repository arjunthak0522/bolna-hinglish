name: Bolna Browser QA

on:
  push:
    branches: ["qa-browser-tests", "release-candidate-clean", "debug-thinking-level", "main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
