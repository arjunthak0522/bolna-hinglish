name: Restore Known Good Voice QA
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".restore-known-good-voice-trigger"]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore exact single-fix voice runtime and verify
        run: |
          GOOD=a493ad580beef81afd4790bda85828a44ce80b66
          git show "$GOOD:app-runtime.js" > app-runtime.js
          git diff --exit-code "$GOOD" -- app-runtime.js
          node --check app-runtime.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app-runtime.js','utf8');
          const a=s.indexOf('function voiceCorePrompt()');
          const b=s.indexOf('function corePrompt',a);
          const prompt=s.slice(a,b);
          if(a<0||b<0)throw new Error('voiceCorePrompt missing');
          if(prompt.includes('JSON.stringify(context)'))throw new Error('context present in voice prompt');
          const c=s.indexOf('async function startListening()');
          const d=s.indexOf('async function submitTyped()',c);
          const flow=s.slice(c,d);
          if(!flow.includes('const d=await voiceCore(b)'))throw new Error('combined known-good voice flow missing');
          if(flow.includes('transcript=await transcribe(b)'))throw new Error('two-stage flow still active');
          const ready=flow.indexOf("state='ready';remember();render();");
          const tts=flow.indexOf('void prefetchVoice(result.speechText)');
          if(!(ready>=0&&tts>ready))throw new Error('result must render before audio prefetch');
          if(!s.includes('<p class="phonetic">${esc(result.phonetic)}</p>'))throw new Error('phonetic display missing');
          console.log('forensic runtime verification PASS');
          NODE
          npm install
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-runtime.js
          git commit -m "Restore exact single-fix voice runtime"
          git push origin HEAD:rescue-single-runtime
