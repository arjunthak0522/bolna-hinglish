name: Apply Reviewed iOS Mic Patch
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".reviewed-ios-mic-trigger"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 0
      - run: python .github/scripts/reviewed_ios_mic_patch.py
      - run: node --check app-runtime.js
      - name: Verify reviewed mic behavior
        run: |
          grep -q "async function waitForMicTrack" app-runtime.js
          grep -q "await waitForMicTrack(current,300)" app-runtime.js
          grep -q "await waitForMicTrack(track,500)" app-runtime.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app-runtime.js
          git commit -m "Refine iPhone mic recovery after peer review"
          git push origin HEAD:rescue-single-runtime
