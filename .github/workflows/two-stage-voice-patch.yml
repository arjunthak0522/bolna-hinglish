name: Two Stage Voice Patch QA
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".two-stage-voice-trigger"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply two-stage voice pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-runtime.js')
          s=p.read_text()
          old="try{state='transcribing';render();const d=await voiceCore(b);if(id!==reqId)return;transcript=d.transcript;localStorage.setItem('bolna_voice_used','1');const inferred=infer(transcript);if(context==='General'&&inferred){context=inferred;localStorage.setItem('bolna_context',inferred)}result={...d,polite:'',casual:'',moreHindi:'',words:[],_enriched:false,_audioState:'loading'};delete result.transcript;result.speechText=canonicalSpeechText(result);state='ready';remember();render();void prefetchVoice(result.speechText)}"
          new="try{state='transcribing';render();transcript=await transcribe(b);if(id!==reqId)return;localStorage.setItem('bolna_voice_used','1');const inferred=infer(transcript);if(context==='General'&&inferred){context=inferred;localStorage.setItem('bolna_context',inferred)}state='generating';render();const d=await generateCore(transcript);if(id!==reqId)return;result={...d,polite:'',casual:'',moreHindi:'',words:[],_enriched:false,_audioState:'loading'};result.speechText=canonicalSpeechText(result);state='ready';remember();render();void prefetchVoice(result.speechText)}"
          if s.count(old)!=1:
              raise SystemExit(f'voice pipeline target count {s.count(old)}')
          p.write_text(s.replace(old,new))
          t=Path('tests/two-stage-voice.test.js')
          t.write_text("""const fs=require('fs');\nconst s=fs.readFileSync('app-runtime.js','utf8');\nconst start=s.indexOf('async function startListening()');\nconst end=s.indexOf('async function submitTyped()',start);\nif(start<0||end<0)throw new Error('startListening block not found');\nconst flow=s.slice(start,end);\nif(flow.includes('voiceCore(b)'))throw new Error('combined voice_core still used by microphone flow');\nconst t=flow.indexOf('transcript=await transcribe(b)');\nconst i=flow.indexOf('const inferred=infer(transcript)');\nconst g=flow.indexOf('const d=await generateCore(transcript)');\nif(!(t>=0&&i>t&&g>i))throw new Error('expected transcribe -> infer context -> generate order missing');\nif(!flow.includes("state='generating';render();"))throw new Error('generating state missing between stages');\nconsole.log('two-stage voice architecture PASS');\n""")
          PY
          node --check app-runtime.js
          node tests/two-stage-voice.test.js
          node tests/voice-context-isolation.test.js
          git diff --check
          npm install
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-runtime.js tests/two-stage-voice.test.js
          git commit -m "Separate voice transcription from Hinglish generation"
          git push origin HEAD:rescue-single-runtime
