name: Bolna Exact Vercel Preview

on:
  workflow_dispatch:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".preview-trigger"]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_gOE1H89laXqgIoZR5yusx8o8
      VERCEL_PROJECT_ID: prj_dNVPPFV0PIood9pszWxkagxSbOJP
      VERCEL_CLI_VERSION: 59.10.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact rescue source
        shell: bash
        run: |
          test "$(git rev-parse --abbrev-ref HEAD)" = "rescue-single-runtime"
          echo "RESCUE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node --check app-runtime.js
          node --check api/gemini.js
          node --check api/health.js

      - name: Probe exact Vercel project access
        id: auth
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Controlled preview skipped: VERCEL_TOKEN is not configured."
            exit 0
          fi
          STATUS=$(curl --silent --output /tmp/project.json --write-out "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          echo "Vercel project access HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/project.json","utf8")||"{}"); console.log("Vercel project access category:", x.error?.code || x.error?.message || "unknown");'
            exit 0
          fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/project.json","utf8")); if(x.id!==process.env.VERCEL_PROJECT_ID) throw new Error("wrong project"); console.log("Verified Vercel project:", x.name);'
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Deploy exact rescue source to preview only
        if: steps.auth.outputs.available == 'true'
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --no-save "vercel@$VERCEL_CLI_VERSION"
          rm -rf .vercel
          PREVIEW_URL=$(npx vercel deploy --yes --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID")
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Verify preview fingerprint
        if: steps.auth.outputs.available == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          HEALTH=$(npx vercel curl /api/health --deployment "$PREVIEW_URL")
          echo "$HEALTH"
          node -e '
            const h=JSON.parse(process.argv[1]);
            const expected=process.env.RESCUE_SHA;
            if(!h.ok) throw new Error("health not ok");
            if(h.service!=="bolna-gemini-gateway") throw new Error("wrong service");
            if(h.runtime!=="single-v1") throw new Error("wrong runtime");
            if(h.environment!=="preview") throw new Error(`wrong environment: ${h.environment}`);
            if(h.branch!=="rescue-single-runtime") throw new Error(`wrong branch: ${h.branch}`);
            if(h.commit!==expected) throw new Error(`wrong commit: ${h.commit} expected ${expected}`);
          ' "$HEALTH"

      - name: Confirm production not targeted
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          case "$PREVIEW_URL" in
            *hinglish-companion.vercel.app) echo "Refusing production alias"; exit 3 ;;
            *) echo "Preview-only deployment verified: $PREVIEW_URL" ;;
          esac
