name: Bolna Protected Preview Smoke

on:
  workflow_dispatch:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".smoke-trigger"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_gOE1H89laXqgIoZR5yusx8o8
      VERCEL_PROJECT_ID: prj_dNVPPFV0PIood9pszWxkagxSbOJP
      PREVIEW_URL: https://hinglish-companion-5efvhtw7m-arjunthak-4571.vercel.app
      EXPECTED_SHA: dac578c9448a05bce65168aa6dc2f5b6dc558a66
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify protected preview and Gemini route
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --no-save vercel@latest

          HEALTH=$(npx vercel curl /api/health --deployment "$PREVIEW_URL")
          node -e '
            const h=JSON.parse(process.argv[1]);
            if(!h.ok || h.service!=="bolna-gemini-gateway" || h.runtime!=="single-v1") throw new Error("health fingerprint failed");
            if(h.environment!=="preview" || h.branch!=="rescue-single-runtime" || h.commit!==process.env.EXPECTED_SHA) throw new Error("preview source fingerprint failed");
            console.log("Health fingerprint verified", {environment:h.environment,branch:h.branch,commit:h.commit});
          ' "$HEALTH"

          RESPONSE=$(npx vercel curl /api/gemini --deployment "$PREVIEW_URL" -- \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Origin: https://arjunthak0522.github.io" \
            --data '{"operation":"generate","prompt":"Reply with the single word OK."}')

          node -e '
            const r=JSON.parse(process.argv[1]);
            if(!r.ok) throw new Error(`Gemini route failed: ${r.category || "unknown"}`);
            if(r.diagnostics?.operation!=="generate") throw new Error("wrong operation diagnostics");
            if(r.diagnostics?.model!=="gemini-3.5-flash-lite") throw new Error(`wrong model: ${r.diagnostics?.model}`);
            if(r.diagnostics?.status!==200) throw new Error(`wrong provider status: ${r.diagnostics?.status}`);
            console.log("Gemini gateway verified", r.diagnostics);
          ' "$RESPONSE"
