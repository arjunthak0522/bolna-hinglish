name: Voice context diagnostic
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".voice-context-diagnostic-trigger"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-single-runtime
      - name: Print voice pipeline snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app-runtime.js').read_text()
          for needle in ["voice_core", "normalizeRecording", "blob64", "transcribe"]:
              print("\n===", needle, "===")
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-700):min(len(s),i+1300)])
                  start=i+len(needle)
          PY
