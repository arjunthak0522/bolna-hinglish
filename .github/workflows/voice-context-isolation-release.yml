name: Voice Context Isolation Production Release
on:
  push:
    branches: ["rescue-single-runtime"]
    paths: [".voice-context-isolation-release-trigger"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_gOE1H89laXqgIoZR5yusx8o8
      VERCEL_PROJECT_ID: prj_dNVPPFV0PIood9pszWxkagxSbOJP
      VERCEL_CLI_VERSION: 59.10.0
      RELEASE_SHA: a493ad580beef81afd4790bda85828a44ce80b66
      PROD_ORIGIN: https://hinglish-companion.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact tested source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node --check app-runtime.js
          node tests/voice-context-isolation.test.js
      - name: Deploy verified source to production once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npm install --no-save "vercel@$VERCEL_CLI_VERSION"
          rm -rf .vercel
          PROD_URL=$(npx vercel deploy --prod --yes --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID")
          echo "PROD_URL=$PROD_URL" >> "$GITHUB_ENV"
      - name: Verify production fingerprint and isolation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          HEALTH=$(npx vercel curl /api/health --deployment "$PROD_URL")
          node -e 'const h=JSON.parse(process.argv[1]); if(!h.ok||h.environment!=="production"||h.commit!==process.env.RELEASE_SHA) throw new Error("production fingerprint mismatch");' "$HEALTH"
          JS=$(npx vercel curl /app-runtime.js --deployment "$PROD_ORIGIN")
          node -e 'const s=process.argv[1],a=s.indexOf("function voiceCorePrompt()"),b=s.indexOf("function corePrompt",a),p=s.slice(a,b); if(a<0||b<0||p.includes("JSON.stringify(context)")||!p.includes("transcript MUST come only from the audio")) throw new Error("voice isolation not live");' "$JS"
