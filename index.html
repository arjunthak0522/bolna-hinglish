<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F8F6F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://hinglish-companion.vercel.app" crossorigin>
  <title>bolna - Hinglish Companion</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .keepTalkingTrigger{min-height:44px!important;padding:8px 1px!important}
    .keepTalkingChoice{min-height:48px!important;padding:12px 13px!important}
    .keepTalkingTrigger b{font-size:0}
    .keepTalkingTrigger b::before{content:'Keep talking';font-size:15px}
    .keepTalkingTrigger b::after{content:'›';display:inline-block;margin-left:8px;font-size:20px;line-height:1;transform:rotate(90deg);transform-origin:center;transition:transform .18s ease;color:#b66024;vertical-align:-1px}
    .keepTalking.open .keepTalkingTrigger b::after{transform:rotate(-90deg)}
    @media(max-width:520px){
      .resultView .speakAgain{position:static!important;left:auto!important;bottom:auto!important;transform:none!important;width:100%!important;margin:18px 0 14px!important;box-shadow:none!important}
    }
  </style>
</head>
<body>
  <main class="canvas"><section class="app" id="app"></section></main>
  <script src="./phrase-library.js"></script>
  <script src="./phrase-library-expanded.js"></script>
  <script src="./phrase-library-tier23-friction.js"></script>
  <script src="./phrase-library-survival.js"></script>
  <script src="./phrase-library-conversation.js"></script>
  <script src="./library-search.js"></script>
  <script src="./app-runtime.js"></script>
  <script src="./keep-talking.js"></script>
  <script>
    document.addEventListener('click',event=>{
      const trigger=event.target.closest&&event.target.closest('.keepTalkingTrigger');
      if(!trigger||window.innerWidth>520)return;
      setTimeout(()=>{
        const card=trigger.closest('.keepTalking');
        if(!card||!card.classList.contains('open'))return;
        const safeBottom=window.innerHeight-84;
        const rect=card.getBoundingClientRect();
        if(rect.bottom>safeBottom)window.scrollBy({top:rect.bottom-safeBottom+16,behavior:'auto'});
      },0);
    });
  </script>
</body>
</html>
